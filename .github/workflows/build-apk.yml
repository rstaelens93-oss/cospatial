name: Build CoSpatial Native APK

on:
  push:
    branches: [main, master]
    paths:
      - 'artifacts/dashboard/**'
      - '.github/workflows/build-apk.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Capacitor → assembleDebug → CoSpatial-Native-App
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. JDK ──────────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ── 3. pnpm (pinned to match lockfile) + Node.js ────────────────────────
      #  Using pnpm/action-setup ensures the exact version that generated
      #  pnpm-lock.yaml is used; npm install -g pnpm can pull a mismatched
      #  version that misreads pnpm-workspace.yaml settings (onlyBuiltDependencies).
      - name: Install pnpm 10.26.1
        uses: pnpm/action-setup@v4
        with:
          version: '10.26.1'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # ── 4. Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform & build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" --channel=0
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # ── 5. Install dependencies ──────────────────────────────────────────────
      #  Uses pnpm (required — package.json references pnpm catalog: protocol).
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # ── 6. Build web assets ──────────────────────────────────────────────────
      #  Vite requires PORT and BASE_PATH; BASE_PATH=/ for native (no sub-path).
      #  Output lands at artifacts/dashboard/dist/public.
      - name: Build dashboard (Vite)
        working-directory: artifacts/dashboard
        env:
          PORT: '3000'
          BASE_PATH: '/'
          NODE_ENV: production
        run: pnpm run build

      # ── 7. Sync Capacitor web assets into the pre-scaffolded Android project ─
      #  The android/ directory is committed to the repo (scaffolded locally via
      #  `pnpm exec cap add android`), so we only need to sync updated web assets.
      - name: Sync Capacitor
        working-directory: artifacts/dashboard
        run: pnpm exec cap sync android

      # ── 8. Build debug APK with Gradle ───────────────────────────────────────
      - name: Build debug APK
        working-directory: artifacts/dashboard/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # ── 9. Upload artifact ───────────────────────────────────────────────────
      - name: Upload CoSpatial-Native-App
        uses: actions/upload-artifact@v4
        with:
          name: CoSpatial-Native-App
          path: artifacts/dashboard/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # ── 10. Summary ──────────────────────────────────────────────────────────
      - name: Build summary
        run: |
          APK=artifacts/dashboard/android/app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(du -h "$APK" | cut -f1)
          echo "## ✅ CoSpatial Native APK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Package | \`com.cospatial.app\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build type | \`debug\` |" >> $GITHUB_STEP_SUMMARY
          echo "| APK size | \`$SIZE\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download **CoSpatial-Native-App** from the _Artifacts_ section." \
            >> $GITHUB_STEP_SUMMARY
