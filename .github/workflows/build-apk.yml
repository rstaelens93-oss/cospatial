name: Build CoSpatial Native APK

on:
  push:
    branches: [main, master]
    paths:
      - 'artifacts/dashboard/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Capacitor → assembleDebug → CoSpatial-Native-App
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. JDK ──────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 4. Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform & build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" --channel=0
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # ── 5. Install web dependencies ──────────────────────────────────────────
      - name: Install dashboard dependencies
        working-directory: artifacts/dashboard
        run: npm install

      # ── 6. Build web assets ──────────────────────────────────────────────────
      #  Vite requires PORT and BASE_PATH; for a native Capacitor build the
      #  app runs locally so BASE_PATH must be '/' (not a sub-path).
      - name: Build dashboard (Vite)
        working-directory: artifacts/dashboard
        env:
          PORT: '3000'
          BASE_PATH: '/'
          NODE_ENV: production
        run: npm run build

      # ── 7. Install Capacitor ─────────────────────────────────────────────────
      - name: Install @capacitor/core and @capacitor/android
        working-directory: artifacts/dashboard
        run: npm install @capacitor/core @capacitor/android

      # ── 8. Initialise Capacitor project ──────────────────────────────────────
      #  Creates capacitor.config.json pointing at the Vite output directory.
      - name: Init Capacitor
        working-directory: artifacts/dashboard
        run: |
          npx cap init "CoSpatial" "com.cospatial.app" \
            --web-dir dist/public

      # ── 9. Add Android platform ──────────────────────────────────────────────
      - name: Add Android platform
        working-directory: artifacts/dashboard
        run: npx cap add android

      # ── 10. Sync web assets into native project ───────────────────────────────
      - name: Sync Capacitor
        working-directory: artifacts/dashboard
        run: npx cap sync android

      # ── 11. Build debug APK with Gradle ──────────────────────────────────────
      - name: Build debug APK
        working-directory: artifacts/dashboard/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # ── 12. Upload artifact ──────────────────────────────────────────────────
      - name: Upload CoSpatial-Native-App
        uses: actions/upload-artifact@v4
        with:
          name: CoSpatial-Native-App
          path: artifacts/dashboard/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # ── 13. Summary ──────────────────────────────────────────────────────────
      - name: Build summary
        run: |
          APK=artifacts/dashboard/android/app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(du -h "$APK" | cut -f1)
          echo "## ✅ CoSpatial Native APK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Package | \`com.cospatial.app\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build type | \`debug\` |" >> $GITHUB_STEP_SUMMARY
          echo "| APK size | \`$SIZE\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download **CoSpatial-Native-App** from the _Artifacts_ section." \
            >> $GITHUB_STEP_SUMMARY
